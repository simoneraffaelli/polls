name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: polls_test
          POSTGRES_USER: polls_test
          POSTGRES_PASSWORD: ci_only_poll_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polls_test -d polls_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:db
        env:
          TEST_DATABASE_URL: postgresql://polls_test:ci_only_poll_test_password@127.0.0.1:5432/polls_test
      - run: pnpm worker:build
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
