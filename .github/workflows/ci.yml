name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: polls_test
      PGUSER: polls_test
      PGPASSWORD: ci_only_poll_test_password
      BETTER_AUTH_SECRET: ci_only_auth_secret_at_least_32_characters
      BETTER_AUTH_URL: http://127.0.0.1:3100
      E2E_ADMIN_EMAIL: e2e-admin@polls.invalid
      E2E_ADMIN_PASSWORD: ci_only_e2e_admin_password_123
      E2E_SCENARIO_ID: 0d68c549-67c3-4855-8514-3228804bb024
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: polls_test
          POSTGRES_USER: polls_test
          POSTGRES_PASSWORD: ci_only_poll_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polls_test -d polls_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Lint, cyclomatic complexity and module size
        run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:db
        env:
          TEST_DATABASE_URL: postgresql://polls_test:ci_only_poll_test_password@127.0.0.1:5432/polls_test
      - run: pnpm worker:build
      - run: pnpm db:migrate
      - run: pnpm exec tsx src/composition/seed-cli.ts
      - run: pnpm admin:provision
        env:
          ADMIN_EMAIL: e2e-admin@polls.invalid
          ADMIN_NAME: CI administrator
          ADMIN_PASSWORD: ci_only_e2e_admin_password_123
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: polls_test
          PGUSER: polls_test
          PGPASSWORD: ci_only_poll_test_password
          BETTER_AUTH_SECRET: ci_only_auth_secret_at_least_32_characters
          BETTER_AUTH_URL: http://127.0.0.1:3100
      - run: pnpm exec tsx tests/e2e/seed-scenario.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: polls-ci
      POSTGRES_PASSWORD: ci_only_owner_password_123
      APP_DATABASE_PASSWORD: ci_only_runtime_password_456
      BETTER_AUTH_SECRET: ci_only_auth_secret_at_least_32_characters
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/operations/backup.sh scripts/operations/restore-check.sh scripts/operations/ci-smoke.sh
      - run: bash scripts/operations/ci-smoke.sh
